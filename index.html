<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>каталог продукции</title>
<meta name="description" content="каталог витаминов и БАД для фармацевтов и сотрудников аптек.">
<meta name="theme-color" content="#1C1916">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.2.0/tabler-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/tabler-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="prog"></div>
<a class="sr" href="#main">Перейти к содержимому</a>

<header class="top" id="top">
  <div class="shell top-in">
    <a class="mark" href="#/" id="nav-home" aria-label="На главную">
      <span class="mark-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>
    </a>
    <span class="top-right">
      <a class="top-link" href="#/catalog" id="nav-cat"><i class="ti ti-layout-grid" aria-hidden="true"></i> <span>Каталог</span></a>
      <span class="lang" id="lang">
        <button data-l="ru" aria-pressed="true">RU</button>
        <button data-l="uz" aria-pressed="false">UZ</button>
      </span>
    </span>
  </div>
</header>

<div class="pbar" id="pbar"><div class="shell pbar-in">
  <b id="pbar-name"></b>
  <span class="pb-act">
  <button class="icon-btn" id="pbar-qr" aria-label="QR-код"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="17"/><line x1="14" y1="20" x2="14" y2="20.01"/><line x1="17" y1="14" x2="20" y2="14"/><line x1="20" y1="17" x2="17" y2="17"/><line x1="17" y1="20" x2="20" y2="20"/></svg></button>   <button class="icon-btn" id="pbar-share" aria-label="Поделиться"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
  </span>
</div></div>

<main id="main"></main>

<footer class="foot">
  <div class="shell">
    <div class="foot-in">
      <div>
        <p class="lead" id="f-about"></p>
      </div>
      <div>
        <h4 id="f-cat-h"></h4>
        <a href="#/catalog" id="f-all"></a>
        <a href="#/catalog?cat=Витамин D" id="f-c1"></a>
        <a href="#/catalog?cat=Омега-3" id="f-c2"></a>
        <a href="#/catalog?cat=Детские витамины" id="f-c3"></a>
      </div>
      <div>
        <h4 id="f-con-h"></h4>
        <a href="tel:" id="f-phone"></a>
        <a href="#/qr" id="f-qr"></a>
      </div>
    </div>
    <div class="disc">
      <span id="f-disc"></span>
      <span id="f-src" style="opacity:.75"></span>
    </div>
  </div>
</footer>

<button id="totop" aria-label="Наверх"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-label="QR-код товара">
  <div class="qr-card">
    <div class="qr-box" id="qrbox"></div>
    <h3 id="qrname"></h3>
    <p class="url" id="qrurl"></p>
    <div class="qr-actions">
      <button id="qrcopy"><i class="ti ti-link" aria-hidden="true"></i> Копировать</button>
      <button id="qrclose"><i class="ti ti-x" aria-hidden="true"></i> Закрыть</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script> -->
<script src="qr-generator.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="script.js">
</script>
</body>
</html>
